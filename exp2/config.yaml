# Horizon and fixed-cycle participation values are derived from the base config
# and the loaded CIFAR-10 dataset. They are intentionally not duplicated here.
base_config: config/cifar10_bandinv_dpadamw_naive.yaml
trajectory: exp2/results/replay_full_horizon/trajectory.npz
trajectory_config: config/cifar10_bandinv_dpadamw_naive.yaml
strategy_dir: exp2/results/replay_full_horizon/strategies
output_dir: exp2/results/replay_full_horizon

samples: 1000
seed: 0
sample_batch_size: 16
target_relative_noise: [0.01, 0.1, 1.0]
bootstrap_seed: 1
bootstrap_replicates: 2000

strategy:
  bandwidth: 4
  reduction: mean
  max_optimizer_steps: 1000
  force_refit: false
