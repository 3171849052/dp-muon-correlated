[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dp-muon-correlated"
version = "0.1.0"
description = "Research scaffolding for non-amplified BandInvMF and DP-Muon"
readme = "README.md"
requires-python = ">=3.11"
# jax_privacy is deliberately supplied by the existing `curve` environment.
dependencies = ["jax", "Pillow", "PyYAML", "scipy", "tqdm"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
