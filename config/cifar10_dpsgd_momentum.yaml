algorithm: dpsgd

experiment:
  name: cifar10_dpsgd_momentum_vit_tiny
  seed: 0

runtime:
  gpu: 3

data:
  data_dir: data

model:
  pretrained: checkpoints/Ti_16-i21k-300ep-lr_0.001-aug_none-wd_0.03-do_0.0-sd_0.0.npz

training:
  epochs: 5
  logical_batch_size: 512
  microbatch_size: 16
  momentum: 0.95
  learning_rate: 0.001
  clip_norm: 1.0
  # Number of actual training epochs between evaluations.
  eval_every: 1

schedule:
  mode: fixed_cycle

privacy:
  epsilon: 3.0
  delta: 1.0e-5
  adjacency: add_remove

output:
  checkpoint_dir: checkpoints
  log_dir: logs
