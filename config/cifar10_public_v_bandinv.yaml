algorithm: dp-adamw-public-v-bandinv

experiment:
  name: cifar10-public-v-bandinv
  seed: 0

runtime:
  gpu: 0

data:
  data_dir: data
  public_source: cifar10_split
  cifar10_public_size: 1000
  public_split_seed: 2026
  cifar100_public_classes: [0, 5, 10, 12, 17, 22, 25, 28, 40, 94]

model:
  pretrained: checkpoints/Ti_16-i21k-300ep-lr_0.001-aug_none-wd_0.03-do_0.0-sd_0.0.npz

training:
  epochs: 5
  logical_batch_size: 512
  microbatch_size: 16
  clip_norm: 1.0
  eval_every: 1
  segment_length: 98

public_v:
  temporal_mode: direct
  beta2: 0.999
  public_v_eps: 1.0e-8
  public_v_batches_per_segment: 1

adamw:
  learning_rate: 0.001
  beta1: 0.9
  weight_decay: 0.01

schedule:
  mode: fixed_cycle

strategy:
  bandwidth: 4
  reduction: mean
  max_optimizer_steps: 1000

privacy:
  epsilon: 3.0
  delta: 1.0e-5
  adjacency: add_remove

output:
  checkpoint_dir: checkpoints/public-v-bandinv
  log_dir: logs
