experiment:
  name: cifar10_nonamplified_vit_tiny
  seed: 0

data:
  data_dir: data

model:
  pretrained: checkpoints/Ti_16-i21k-300ep-lr_0.001-aug_none-wd_0.03-do_0.0-sd_0.0.npz

training:
  epochs: 10
  logical_batch_size: 512
  microbatch_size: 16
  momentum: 0.9
  learning_rate: 0.5
  clip_norm: 10.0
  eval_every: 50

schedule:
  mode: fixed_cycle

privacy:
  epsilon: 9.0
  delta: 1.0e-5
  adjacency: add_remove

strategy:
  bandwidth: 4
  reduction: mean
  max_optimizer_steps: 1000
  force_refit: false

output:
  strategy_dir: artifacts/strategies
  checkpoint_dir: checkpoints
  log_dir: logs
