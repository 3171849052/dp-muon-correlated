algorithm: dpsgd
experiment:
  name: exp1_dpsgd_lr0.1_clip10
  seed: 0
runtime:
  gpu: 1
data:
  data_dir: data
model:
  pretrained: checkpoints/Ti_16-i21k-300ep-lr_0.001-aug_none-wd_0.03-do_0.0-sd_0.0.npz
training:
  epochs: 10
  logical_batch_size: 512
