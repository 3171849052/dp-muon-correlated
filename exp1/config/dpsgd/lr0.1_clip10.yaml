  clip_norm: 10.0
  eval_every: 1
schedule:
  mode: fixed_cycle
privacy:
  epsilon: 9.0
  delta: 1.0e-05
  adjacency: add_remove
output:
  checkpoint_dir: checkpoints
  log_dir: exp1/logs/dpsgd
